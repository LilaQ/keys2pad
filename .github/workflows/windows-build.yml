name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore XInput.KeyBridge.sln
      - name: Build
        run: dotnet build XInput.KeyBridge.sln -c Release --no-restore
      - name: Model self-tests
        run: dotnet run --project tests/XInput.KeyBridge.Tests/XInput.KeyBridge.Tests.csproj -c Release --no-build
      - name: Publish x64
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: XInput-KeyBridge-win-x64
          path: artifacts/XInput-KeyBridge-win-x64/
